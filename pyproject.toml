[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fusion"
dynamic = ["version"]
description = "DuckDB-powered in-memory OLAP engine — LLM tool for analytics"
requires-python = ">=3.12"
license = {text = "Apache-2.0"}
readme = "README.md"
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "duckdb>=1.5,<2",
    "pyarrow>=25.0.1,<26",
    "requests>=2.34,<3",
    "sqlglot>=30.0,<31",
]

[project.optional-dependencies]
rest = ["fastapi>=0.141,<1.0", "uvicorn>=0.53,<1.0", "slowapi>=0.1.10,<0.2"]
mcp = ["mcp[cli]>=2.2,<3"]
pandas = ["pandas>=3.0,<4"]
demo = ["fusion[pandas]", "numpy>=2.5,<3"]
dev = [
    "pytest>=9.1,<10",
    "pytest-cov>=7.1,<8",
    "ruff>=0.16.8,<0.17",
    "mypy>=2.3,<3",
    "responses>=0.26.3,<1",
    "httpx>=0.28,<1",  # fastapi.testclient; no longer transitive once mcp 2 uses httpx2
    "pip-audit>=2.7",
]
all = ["fusion[rest,mcp,pandas,demo,dev]"]

[project.scripts]
fusion-mcp = "fusion.adapters.inbound.cli.mcp_main:main"
fusion-rest = "fusion.adapters.inbound.cli.rest_main:main"

[tool.hatch.version]
path = "fusion/__init__.py"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
# Third-party libs without type stubs (requests, slowapi, ...).
ignore_missing_imports = true
disable_error_code = ["import-untyped"]

[[tool.mypy.overrides]]
# The pure layers must type-check strictly; adapters may stay looser.
# (`strict` itself is global-only in mypy, so the flags are spelled out.)
module = ["fusion.domain.*", "fusion.ports.*", "fusion.application.*"]
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_calls = true
disallow_any_generics = true
warn_return_any = true
warn_unused_ignores = true
strict_equality = true
no_implicit_reexport = true

[tool.pytest.ini_options]
testpaths = ["tests"]
xfail_strict = true
filterwarnings = [
    "error::DeprecationWarning:fusion.*",
]

[tool.coverage.run]
source = ["fusion"]

[tool.coverage.report]
# Ratchet: keep coverage from regressing (currently ~97%).
fail_under = 80
show_missing = true
